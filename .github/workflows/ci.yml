name: CI
on:
  push:
    branches: [main, dev, "feature/**"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    # Self-hosted Windows workstation runner: exercises the exact Windows PowerShell 5.1 / .NET Framework 4.8
    # runtime the bundle targets. Needs Git; the setup actions below install the .NET SDK and Node without admin rights.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 8.0.426
        env:
          DOTNET_INSTALL_DIR: ${{ runner.tool_cache }}\dotnet
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      # Fairlead.Core.csproj is the C# 5 check (LangVersion 5, net48 reference assemblies, framework references
      # only); the tests compile the same core .cs files for net8.0 and net48.
      - name: Core C# 5 check build and tests (net8.0 + net48)
        shell: powershell
        run: |
          dotnet build Fairlead.sln -c Release --nologo
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          dotnet test Fairlead.sln -c Release --no-build --nologo --logger "trx;LogFileName=core.trx" --results-directory TestResults
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      # Exactly what the launcher does on the workstation: fresh Windows PowerShell 5.1 processes compile
      # src\Fairlead.Core\**\*.cs in memory with Add-Type -CompilerParameters (the inbox C# 5 compiler).
      # Fails on any C# 6+ syntax, a non-framework reference or an assembly loaded from disk; reports the compile time.
      - name: Core compiles with Windows PowerShell 5.1 Add-Type (C# 5)
        shell: powershell
        run: .\build\Test-FairleadAddType.ps1 -Runs 3

      - name: UI typecheck, tests, build
        shell: powershell
        working-directory: web
        run: |
          $ErrorActionPreference = 'Stop'
          if (Test-Path package-lock.json) { npm ci --no-audit --no-fund } else { npm install --no-audit --no-fund }
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm run typecheck; if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm test; if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm run build; if ($LASTEXITCODE) { exit $LASTEXITCODE }
          # web/dist is committed so a plain checkout launches with its UI; it must match the source.
          # Line endings are ignored: the Windows checkout turns the UI sources into CRLF, so the build emits CRLF here.
          git diff --ignore-cr-at-eol --exit-code --stat -- dist
          $changed = $LASTEXITCODE
          $added = @(git ls-files --others --exclude-standard -- dist)
          if ($changed -or $added.Count -gt 0) { $added; throw 'web/dist is out of date: run npm run build in web and commit web/dist.' }

      - name: Pester on Windows PowerShell 5.1
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          [Net.ServicePointManager]::SecurityProtocol = [Net.ServicePointManager]::SecurityProtocol -bor [Net.SecurityProtocolType]::Tls12
          if (-not (Get-Module -ListAvailable Pester | Where-Object Version -ge '5.0')) {
            Install-PackageProvider -Name NuGet -MinimumVersion 2.8.5.201 -Scope CurrentUser -Force | Out-Null
            Install-Module Pester -MinimumVersion 5.5 -Scope CurrentUser -Force -SkipPublisherCheck -AllowClobber
          }
          Import-Module Pester -MinimumVersion 5.0
          $c = New-PesterConfiguration
          $c.Run.Path = 'tests/pester'
          $c.Run.PassThru = $true
          $c.Output.Verbosity = 'Detailed'
          $r = Invoke-Pester -Configuration $c
          foreach ($t in $r.Failed) {
            $msg = ($t.ErrorRecord | Select-Object -First 1).Exception.Message -replace '\r?\n', ' '
            Write-Host ('::error title=Pester ' + ($t.ExpandedPath -replace '::', ' ') + '::' + $msg)
          }
          Write-Host "::notice title=Pester on PowerShell $($PSVersionTable.PSVersion)::$($r.PassedCount) passed, $($r.FailedCount) failed"
          if ($r.FailedCount -gt 0 -or $r.Result -ne 'Passed') { exit 1 }

      - name: Assemble bundle (core as source, no DLLs)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          .\build\Build-Fairlead.ps1 -SkipTests -SkipWeb
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = Get-ChildItem dist\Fairlead-*.zip | Select-Object -First 1
          $entries = @([IO.Compression.ZipFile]::OpenRead($zip.FullName).Entries | ForEach-Object { $_.FullName })
          $bin = @($entries | Where-Object { $_ -match '(?i)\.(dll|exe|pdb)$' })
          if ($bin.Count -gt 0) { throw ('Bundle contains binaries: ' + ($bin -join ', ')) }
          $cs = @($entries | Where-Object { $_ -match '^src[\\/]Fairlead\.Core[\\/].*\.cs$' })
          if ($cs.Count -lt 20) { throw ('Bundle is missing the core source (' + $cs.Count + ' .cs files)') }
          Write-Host ('::notice title=Bundle::' + $zip.Name + ': ' + $entries.Count + ' entries, ' + $cs.Count + ' core .cs files, no DLL')

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: fairlead-${{ github.sha }}
          path: |
            dist/*.zip
            TestResults/
          if-no-files-found: warn
