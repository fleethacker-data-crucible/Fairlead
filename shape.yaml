Exact request shapes your client should construct
For grok_4_6:

POST ${AI_GATEWAY_BASE_URL}/ai-gateway/openai/v1/responses
Authorization: Bearer ${DATABRICKS_TOKEN}
Content-Type: application/json
{
  "model": "system.ai.grok-4-6",
  "max_output_tokens": 256,
  "input": [
    {
      "role": "user",
      "content": [
        {
          "type": "input_text",
          "text": "Hello!"
        }
      ]
    }
  ]
}
