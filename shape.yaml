Tell your AI this implementation rule
Resolve endpoint configuration in this order:

1. Resolve the requested logical route to a model registry key.
2. Read models.<model_key>.endpoint.
3. Read endpoints.<endpoint_key>.
4. Read the base URL from the environment variable named in
   endpoints.<endpoint_key>.base_url_env.
5. Construct the final URL as:
      remove_trailing_slash(base_url) + endpoint.path
6. Read the bearer-token environment variable from:
      endpoints.<endpoint_key>.headers.Authorization.token_env
7. Construct the POST request using the endpoint request-body template.
8. Insert models.<model_key>.model_id into the payload's model field.

Do not hardcode hosts, paths, tokens, or model IDs in application code.
Do not send YAML implementation metadata to the endpoint.
This gives the AI an unambiguous endpoint model while keeping the deployment-specific host entirely outside the repository.
